site_name: Setuav Studio
site_description: User and developer documentation for Setuav Studio
site_author: Setuav
site_url: https://setuav.github.io/Studio/
repo_url: https://github.com/Setuav/Studio
repo_name: Setuav/Studio
edit_uri: edit/main/docs/

theme:
  name: material
  logo: images/studio.svg
  favicon: images/studio.svg
  font:
    text: Fira Sans
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js

nav:
  - User Guide:
      - Home: index.md
      - Getting Started: user-guide/getting-started.md
      - Interface: user-guide/interface.md
      - Parametric Model: user-guide/parametric-model.md
      - Plugin Manager: user-guide/plugins.md
      - Reference:
          - Geometry: reference/geometry.md
          - Airfoils: reference/airfoils.md
          - Aerodynamics: reference/aerodynamics.md
          - Propulsion: reference/propulsion.md
          - Flight Performance: reference/flight-performance.md
          - Mass and Balance: reference/mass-balance.md
  - Developer Guide:
      - Overview: developer/index.md

site_dir: build/docs/site
