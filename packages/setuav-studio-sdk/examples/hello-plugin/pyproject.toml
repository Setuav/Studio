[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setuav-studio-example-plugin"
version = "0.1.0"
description = "Example Setuav Studio plugin built with the SDK"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "setuav-studio-sdk>=0.1,<0.2",
]

[project.entry-points."setuav_studio.plugins"]
"com.example.hello" = "setuav_example_plugin.plugin:HelloPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/setuav_example_plugin"]
