name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
  QT_QPA_PLATFORM: offscreen

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --group dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked pyright
      - name: Test
        run: uv run --locked python -m tests.suites all

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv run --locked --group package python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/setuav-package-smoke"
          "${RUNNER_TEMP}/setuav-package-smoke/bin/python" -m pip install dist/*.whl
      - name: Verify installed package
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/setuav-package-smoke/bin/python" \
            "${GITHUB_WORKSPACE}/scripts/package_smoke_test.py"

  desktop:
    name: Desktop bundle smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
      - name: Install desktop dependencies
        run: uv sync --locked --all-extras --group desktop
      - name: Build one-folder application
        run: uv run --locked --all-extras --group desktop pyinstaller --noconfirm --clean setuav-studio.spec
      - name: Verify bundled resources
        run: python scripts/verify_desktop_resources.py dist/setuav-studio
      - name: Verify desktop startup
        run: python scripts/desktop_startup_smoke_test.py dist/setuav-studio
