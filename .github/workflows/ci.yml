name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
  QT_QPA_PLATFORM: offscreen
  QT_OPENGL: software
  QSG_RHI_BACKEND: software
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux graphics and display libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 \
            libxcb-xinerama0 xvfb
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --group dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked pyright
      - name: Test application
        run: xvfb-run -a uv run --locked pytest

  package:
    name: Package smoke test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv run --locked --group package python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/setuav-package-smoke"
          "${RUNNER_TEMP}/setuav-package-smoke/bin/python" -m pip install dist/*.whl
      - name: Verify installed package
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/setuav-package-smoke/bin/python" \
            "${GITHUB_WORKSPACE}/scripts/package_smoke_test.py"

  desktop:
    name: Desktop bundle smoke test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux graphics and display libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 \
            libxcb-xinerama0 xvfb
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
      - name: Install desktop dependencies
        run: uv sync --locked --all-extras --group desktop
      - name: Build one-folder application
        run: uv run --locked --all-extras --group desktop pyinstaller --noconfirm --clean packaging/setuav-studio.spec
      - name: Verify bundled resources
        run: python scripts/verify_desktop_resources.py dist/setuav-studio
      - name: Verify desktop startup
        run: xvfb-run -a python scripts/desktop_startup_smoke_test.py dist/setuav-studio
