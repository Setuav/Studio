name: Dependency audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --group security
      - name: Check dependency declarations
        run: uv run --locked --all-extras --group security deptry src
      - name: Audit known vulnerabilities
        run: uv run --locked --all-extras --group security pip-audit --local --progress-spinner=off
      - name: Check dependency licenses
        run: uv run --locked --all-extras --group security pip-licenses
