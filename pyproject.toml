[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setuav-studio"
version = "0.1.0"
description = "Plugin-based UAV design and analysis studio"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "PySide6>=6.8,<7",
    "shiboken6>=6.8,<7",
    "qtawesome>=1.3,<2",
    "qt-themes>=0.4,<0.5",
    "packaging>=23,<27",
    "setuav-pythrust>=0.3.1,<0.4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "asteval>=1.0.5,<2",
]

[project.optional-dependencies]
aerodynamics = [
    "aerosandbox>=4.2.10,<5",
]

[project.scripts]
setuav-studio = "setuav_studio.__main__:main"

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "pyright>=1.1.411,<2",
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.14,<1",
]
package = [
    "build>=1.5,<2",
]
docs = [
    "mkdocs-material>=9.6,<10",
]
desktop = [
    "pyinstaller>=6.22,<7",
]
security = [
    "deptry>=0.25,<1",
    "pip-audit>=2.10,<3",
    "pip-licenses>=5.5,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/setuav_studio", "src/plugins"]

[tool.deptry.package_module_name_map]
setuav-pythrust = "pythrust"
qt-themes = "qt_themes"

[tool.pip-licenses]
from = "mixed"
format = "markdown"
with-urls = true
fail-on = "GNU Affero General Public License v3;GNU Affero General Public License v3 or later (AGPLv3+);GNU General Public License v3 (GPLv3);GNU General Public License v3 or later (GPLv3+)"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
allowed-confusables = ["α", "γ", "ρ", "×", "–", "ℹ"]
select = ["B", "C4", "C90", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
ignore = ["UP040", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["setuav_studio", "plugins"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["setuav_studio", "plugins"]

[tool.coverage.report]
fail_under = 68
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"
title = "Setuav Studio Coverage"

[tool.pyright]
extraPaths = ["src"]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
