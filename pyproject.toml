[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setuav-studio"
version = "0.1.0"
description = "Plugin-based UAV design and analysis studio"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "qtawesome>=1.3.0",
    "packaging>=23.0",
    "setuav-pythrust>=0.2.1",
    "jsonschema>=4.19",
    "referencing>=0.30",
    "pyvista>=0.48.4",
    "pyvistaqt>=0.12.0",
]

[project.optional-dependencies]
aerodynamics = [
    "aerosandbox>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/setuav_studio"]
