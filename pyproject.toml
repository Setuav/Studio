[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setuav-studio"
version = "0.1.0"
description = "Plugin-based UAV design and analysis studio"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "PySide6>=6.8,<7",
    "shiboken6>=6.8,<7",
    "qtawesome>=1.3,<2",
    "qt-themes>=0.4,<0.5",
    "packaging>=23,<27",
    "setuav-pythrust>=0.2.1,<0.3",
    "jsonschema>=4.19,<5",
    "referencing>=0.30,<1",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
aerodynamics = [
    "aerosandbox>=4.2.10,<5",
    "pyvista>=0.46.4,<1",
]

[project.scripts]
setuav-studio = "setuav_studio.__main__:main"

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "pre-commit>=4.6,<5",
    "pyright>=1.1.411,<2",
    "ruff>=0.14,<1",
]
package = [
    "build>=1.5,<2",
]
desktop = [
    "pyinstaller>=6.22,<7",
]
security = [
    "deptry>=0.25,<1",
    "pip-audit>=2.10,<3",
    "pip-licenses>=5.5,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/setuav_studio"]

[tool.deptry.package_module_name_map]
setuav-pythrust = "pythrust"
qt-themes = "qt_themes"

[tool.pip-licenses]
from = "mixed"
format = "markdown"
with-urls = true
fail-on = "GNU Affero General Public License v3;GNU Affero General Public License v3 or later (AGPLv3+);GNU General Public License v3 (GPLv3);GNU General Public License v3 or later (GPLv3+)"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
allowed-confusables = ["α", "γ", "ρ", "×", "–"]
select = ["B", "C4", "C90", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["setuav_studio"]

[tool.coverage.report]
fail_under = 68
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"
title = "Setuav Studio Coverage"

[tool.pyright]
include = [
    "src/setuav_studio/sdk",
    "src/setuav_studio/ui/about_dialog.py",
    "src/setuav_studio/plugins/aerodynamics/engine/base.py",
    "src/setuav_studio/plugins/aerodynamics/engine/aerosandbox_engine.py",
    "src/setuav_studio/plugins/aerodynamics/engine/airfoil_cache.py",
    "src/setuav_studio/plugins/aerodynamics/engine/airfoil_engine.py",
    "src/setuav_studio/plugins/aerodynamics/engine/airfoil_models.py",
    "src/setuav_studio/plugins/aerodynamics/engine/stability_engine.py",
    "src/setuav_studio/plugins/aerodynamics/engine/stability_models.py",
    "src/setuav_studio/plugins/electrical_propulsion/engine/base.py",
    "src/setuav_studio/plugins/electrical_propulsion/engine/solver.py",
    "src/setuav_studio/plugins/flight_performance/engine/models.py",
    "src/setuav_studio/plugins/flight_performance/engine/solver.py",
    "src/setuav_studio/plugins/geometry/engine/airfoil.py",
    "src/setuav_studio/plugins/geometry/engine/data.py",
    "src/setuav_studio/plugins/geometry/engine/fuselage_geometry.py",
    "src/setuav_studio/plugins/geometry/engine/lifting_surface_geometry.py",
    "src/setuav_studio/plugins/geometry/engine/transforms.py",
    "src/setuav_studio/plugins/geometry/engine/wing_driver_solver.py",
    "src/setuav_studio/plugins/geometry/engine/wing_planform_engine.py",
    "src/setuav_studio/plugins/geometry/engine/wing_sections_engine.py",
    "src/setuav_studio/plugins/weight_balance/engine/base.py",
    "src/setuav_studio/plugins/weight_balance/engine/solver.py",
    "src/setuav_studio/plugins/weight_balance/engine/spatial.py",
    "src/setuav_studio/ui/buttons.py",
    "src/setuav_studio/ui/icons.py",
    "src/setuav_studio/ui/log_buffer.py",
    "src/setuav_studio/ui/log_window.py",
    "src/setuav_studio/ui/main_toolbar.py",
    "src/setuav_studio/ui/numeric_spinbox.py",
    "src/setuav_studio/ui/property_tables.py",
    "src/setuav_studio/ui/theme.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
